<!--
  CoSTAR Network — Public Events Calendar
  ========================================
  Self-contained static page: no build step, no dependencies, no server.
  Reads event data from ./events.json at runtime (fetched with
  cache: "no-store"). Designed to be hosted on GitHub Pages and embedded
  elsewhere via <iframe> — event links use target="_top" to navigate the
  parent page rather than the iframe.

  See ../README.md for deployment/configuration and ../ARCHITECTURE.md for
  how this works internally (month-grid generation, the lab-colour vs
  tag-colour systems, modal state, the iframe-resize postMessage contract).
  See ../SECURITY.md for the rendering/escaping rules referenced inline
  below — don't remove those without reading that doc first.
-->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoSTAR Network — Upcoming Events</title>
<style>
  :root{
    /* ---- swap these for CoSTAR's exact brand values once you have them ---- */
    --accent: #2563eb;          /* used for "today" highlight + nav hover */
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --ink: #14151a;
    --muted: #6b7280;
    --line: #e6e7eb;
    --bg: #ffffff;
    --bg-soft: #f7f7f8;
  }

  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:transparent; }
  body{ font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }

  .cal-app{ max-width: 880px; margin: 0 auto; padding: 4px; }

  .cal-card{
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,21,26,.04), 0 12px 28px -16px rgba(20,21,26,.14);
  }

  /* ---------- header ---------- */
  .cal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap;
  }
  .cal-title{ font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .cal-nav{ display:flex; align-items:center; gap: 6px; }
  .cal-iconbtn{
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
    cursor: pointer; display:flex; align-items:center; justify-content:center;
    transition: background .15s, border-color .15s;
  }
  .cal-iconbtn:hover{ background: var(--bg-soft); border-color: #d7d9de; }
  .cal-iconbtn svg{ width:16px; height:16px; stroke: var(--ink); }
  .cal-todaybtn{
    padding: 6px 13px; border-radius: 8px; border: 1px solid var(--line); background:#fff;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 4px;
    transition: background .15s;
  }
  .cal-todaybtn:hover{ background: var(--bg-soft); }

  /* ---------- filter bar (doubles as the legend) ---------- */
  .cal-filterbar{
    padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--bg-soft);
  }
  .cal-filter-label{
    display:block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .cal-filterbar-chips{ display:flex; flex-wrap:wrap; align-items:center; gap: 8px; }
  .cal-filter-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:#fff;
    color:var(--muted); cursor:pointer; font-family: inherit; transition: all .1s;
  }
  .cal-filter-chip:hover{ border-color:#c9cbd1; }
  .cal-filter-chip.is-active{ border-color: transparent; }
  .cal-filter-dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .cal-filter-clear{
    font-size:12px; color:var(--muted); background:none; border:none; text-decoration:underline;
    cursor:pointer; font-family:inherit; padding:5px 4px;
  }
  .cal-filter-empty{ font-size:12px; color:var(--muted); }

  /* ---------- weekday row ---------- */
  .cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
  .cal-weekdays div{
    padding: 9px 0; text-align:center; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- grid ---------- */
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(92px, 1fr); transition: opacity .12s ease; }
  .cal-grid.is-fading{ opacity: 0; }

  .cal-cell{
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 6px 6px 8px; display:flex; flex-direction:column; gap:3px; min-width: 0;
  }
  .cal-cell:nth-child(7n){ border-right: none; }
  .cal-cell.is-outside{ background: var(--bg-soft); }
  .cal-cell.is-weekend:not(.is-outside){ background: #fbfbfc; }

  .cal-daynum{
    width: 23px; height: 23px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 12.5px; font-weight: 700; color: var(--ink);
  }
  .cal-cell.is-outside .cal-daynum{ color: #c7c9d1; }
  .cal-cell.is-today .cal-daynum{ background: var(--accent); color: #fff; }

  .cal-events{ display:flex; flex-direction:column; gap: 3px; min-width:0; }
  .cal-pill{
    display:flex; align-items:center; gap: 5px; font: inherit; font-size: 11.5px; line-height: 1.35;
    font-weight: 600; padding: 2px 6px; border-radius: 6px; border:none;
    text-decoration:none; color: inherit; cursor:pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align:left;
    transition: filter .1s;
  }
  .cal-pill:hover{ filter: brightness(0.94); }
  .cal-dot{ width:6px; height:6px; border-radius:50%; flex: 0 0 auto; }
  .cal-more{
    font-size: 11px; color: var(--muted); font-weight: 700; background: none; border: none;
    padding: 2px 6px; text-align:left; cursor: pointer; font-family: inherit;
  }
  .cal-more:hover{ color: var(--ink); }

  .cal-footer{ padding: 10px 22px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }
  .cal-error{ grid-column: 1 / -1; padding: 32px 22px; font-size: 13px; color: var(--muted); line-height:1.5; }

  @media (max-width: 560px){
    .cal-title{ font-size: 16px; }
    .cal-grid{ grid-auto-rows: minmax(64px, 1fr); }
    .cal-daynum{ width:20px; height:20px; font-size:11px; }
    .cal-cell{ padding: 4px; }
    .cal-pill{ font-size: 0; padding: 0; background: none !important; justify-content:center; }
    .cal-pill .cal-dot{ margin: 2px auto 0; }
    .cal-more{ font-size: 9.5px; padding: 0; text-align:center; }
  }

  /* ---------- modal ---------- */
  .cal-modal-backdrop{
    position: fixed; inset: 0; background: rgba(15,17,21,.45); display:flex; align-items:center;
    justify-content:center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 1000;
  }
  .cal-modal-backdrop.is-open{ opacity: 1; pointer-events: auto; }
  .cal-modal{
    background: #fff; border-radius: 16px; width: 100%; max-width: 420px; max-height: 78vh;
    overflow-y: auto; padding: 20px; box-shadow: 0 24px 48px -14px rgba(0,0,0,.3);
    transform: translateY(6px); transition: transform .15s;
  }
  .cal-modal-backdrop.is-open .cal-modal{ transform: translateY(0); }
  .cal-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .cal-modal-head h3{ margin:0; font-size: 14px; font-weight: 700; color: var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .cal-modal-close{
    width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--bg-soft);
    cursor: pointer; display:flex; align-items:center; justify-content:center; font-size: 14px; color: var(--muted);
  }

  /* day-list mode */
  .cal-modal-list-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; font: inherit; font-size:13px;
    font-weight:600; padding: 10px 4px; border:none; background:none; border-top: 1px solid var(--line); cursor:pointer;
  }
  .cal-modal-list-item:first-child{ border-top:none; }
  .cal-modal-list-item:hover{ background: var(--bg-soft); }

  /* event-detail mode */
  .cal-modal-back{
    display:block; background:none; border:none; font: inherit; font-size:12.5px; font-weight:700;
    color: var(--muted); cursor:pointer; padding: 0 0 12px; font-family: inherit;
  }
  .cal-modal-back:hover{ color: var(--ink); }
  .cal-modal-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 10px; }
  .cal-modal-tag{
    display:inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 3px 8px; border-radius: 5px;
  }
  .cal-modal-bigtitle{ font-size: 16px; font-weight: 700; line-height:1.35; margin-bottom: 6px; }
  .cal-modal-meta{ font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .cal-modal-cta{
    display:flex; align-items:center; justify-content:center; gap:6px; width:100%; box-sizing:border-box;
    background: var(--ink); color:#fff; text-decoration:none; font-weight:700; font-size:13.5px;
    padding: 11px 14px; border-radius: 10px; transition: opacity .12s;
  }
  .cal-modal-cta:hover{ opacity: .88; }
</style>
</head>
<body>

<div class="cal-app">
  <div class="cal-card">

    <div class="cal-header">
      <div class="cal-title" id="calTitle">Month Year</div>
      <div class="cal-nav">
        <button class="cal-todaybtn" id="calToday">Today</button>
        <button class="cal-iconbtn" id="calPrev" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="cal-iconbtn" id="calNext" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="cal-filterbar">
      <span class="cal-filter-label">Filter by tag</span>
      <div class="cal-filterbar-chips" id="calFilterBar"></div>
    </div>

    <div class="cal-weekdays">
      <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="cal-footer">Click an event to see details, tags, and the full event link.</div>
  </div>
</div>

<div class="cal-modal-backdrop" id="calModalBackdrop">
  <div class="cal-modal" role="dialog" aria-modal="true" aria-labelledby="calModalHeading">
    <div class="cal-modal-head">
      <h3 id="calModalHeading">Date</h3>
      <button class="cal-modal-close" id="calModalClose" aria-label="Close">✕</button>
    </div>
    <div id="calModalBody"></div>
  </div>
</div>

<script>
(function(){

  /* ----------------------------------------------------------------------
     Event colour now follows the Lab, not the tag — a fixed lookup (not a
     hash), so each lab always renders exactly the colour chosen for it.
     Tag chips (filter bar, the little tag badges in the event card) still
     use their own hash-based colour further down — that's deliberate:
     tags aren't tied to one lab, so they can't borrow the lab's colour.
  ---------------------------------------------------------------------- */
  const LAB_COLOURS = {
    "National Lab":   { bg: "#fdece1", text: "#c2410c" }, // Orange
    "Realtime Lab":   { bg: "#dbeafe", text: "#1d4ed8" }, // Blue
    "Screen Lab":     { bg: "#cffafe", text: "#0e7490" }, // Light blue
    "Live Lab":       { bg: "#fce7f3", text: "#be185d" }, // Pink
    "Foresight Lab":  { bg: "#fef9c3", text: "#a16207" }, // Yellow
    "CoSTAR Network": { bg: "#eef0f2", text: "#4b5563" }  // Grey
  };
  const NO_LAB_COLOUR = { bg: "#eef0f2", text: "#4b5563" }; // Grey — also covers no lab attached
  function labColor(lab){ return (lab && LAB_COLOURS[lab]) || NO_LAB_COLOUR; }

  // Tag chips (filter bar + the tag badges inside an event's detail card)
  // keep their own colour, independent of lab, via a simple hash so any
  // new tag added later gets a consistent colour automatically.
  const TAG_PALETTE = [
    { bg: "#e8effe", text: "#1d4ed8" }, { bg: "#f1e9fd", text: "#6d28d9" },
    { bg: "#e2f5ef", text: "#047857" }, { bg: "#fef6e0", text: "#a16207" },
    { bg: "#e0f2fe", text: "#0369a1" }, { bg: "#eef0f2", text: "#4b5563" }
  ];
  function hashStr(s){
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function tagColor(tag){ return tag ? TAG_PALETTE[hashStr(tag) % TAG_PALETTE.length] : TAG_PALETTE[5]; }

  function pad(n){ return String(n).padStart(2,"0"); }
  function dkey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function parseISO(str){ const [y,m,d] = str.split("-").map(Number); return { y, m: m-1, d }; }
  function generateId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
  }
  const escapeAttr = escapeHtml;

  function formatEventDate(ev){
    if (ev.date){
      const {y,m,d} = parseISO(ev.date);
      return new Date(y,m,d).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }
    if (ev.startDate && ev.endDate){
      const s = parseISO(ev.startDate), e = parseISO(ev.endDate);
      const sD = new Date(s.y,s.m,s.d), eD = new Date(e.y,e.m,e.d);
      const sameMonth = s.y === e.y && s.m === e.m;
      const startStr = sD.toLocaleDateString("en-GB", { day:"numeric", month: sameMonth ? undefined : "long" });
      const endStr = eD.toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
      return `${startStr} – ${endStr}`;
    }
    return "";
  }

  function buildEventMap(events){
    const map = new Map();
    function add(key, ev){ if (!map.has(key)) map.set(key, []); map.get(key).push(ev); }
    events.forEach(ev => {
      if (ev.date){
        add(ev.date, ev);
      } else if (ev.startDate && ev.endDate){
        const start = parseISO(ev.startDate), end = parseISO(ev.endDate);
        let cursor = new Date(start.y, start.m, start.d);
        const last = new Date(end.y, end.m, end.d);
        let guard = 0;
        while (cursor <= last && guard < 90){
          add(dkey(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()), ev);
          cursor.setDate(cursor.getDate()+1);
          guard++;
        }
      }
    });
    return map;
  }

  /* ---------------------------------------------------------------------- */

  let ALL_EVENTS = [];
  let eventMap = new Map();
  let eventsById = new Map();
  const activeTags = new Set();

  const today = new Date();
  let viewDate = new Date(today.getFullYear(), today.getMonth(), 1);

  const gridEl = document.getElementById("calGrid");
  const titleEl = document.getElementById("calTitle");
  const filterBarEl = document.getElementById("calFilterBar");

  function maxVisible(){ return window.innerWidth < 560 ? 4 : 2; }

  function visibleEventsFor(dayEvents){
    if (!activeTags.size) return dayEvents;
    return dayEvents.filter(ev => (ev.tags||[]).some(t => activeTags.has(t)));
  }

  function renderFilterBar(){
    const tagsSet = new Set();
    ALL_EVENTS.forEach(e => (e.tags||[]).forEach(t => tagsSet.add(t)));
    const tags = Array.from(tagsSet).sort();

    if (!tags.length){
      filterBarEl.innerHTML = `<span class="cal-filter-empty">No tags yet</span>`;
      return;
    }

    filterBarEl.innerHTML = tags.map(t => {
      const c = tagColor(t);
      const active = activeTags.has(t);
      const style = active ? `background:${c.bg};color:${c.text}` : "";
      return `<button type="button" class="cal-filter-chip ${active?'is-active':''}" data-tag="${escapeAttr(t)}" style="${style}">
        <span class="cal-filter-dot" style="background:${c.text}"></span>${escapeHtml(t)}
      </button>`;
    }).join("") + (activeTags.size ? `<button type="button" class="cal-filter-clear" id="calFilterClear">Clear filters</button>` : "");

    filterBarEl.querySelectorAll(".cal-filter-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const t = btn.dataset.tag;
        if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
        renderFilterBar(); render();
      });
    });
    const clearBtn = document.getElementById("calFilterClear");
    if (clearBtn) clearBtn.addEventListener("click", () => { activeTags.clear(); renderFilterBar(); render(); });
  }

  function render(){
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    titleEl.textContent = viewDate.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

    const firstOfMonth = new Date(y, m, 1);
    const firstWeekday = (firstOfMonth.getDay() + 6) % 7; // Mon=0 ... Sun=6

    let html = "";
    for (let i = 0; i < 42; i++){
      const cellDate = new Date(y, m, i - firstWeekday + 1);
      const cy = cellDate.getFullYear(), cm = cellDate.getMonth(), cd = cellDate.getDate();
      const key = dkey(cy, cm, cd);
      const dayEventsAll = eventMap.get(key) || [];
      const dayEvents = visibleEventsFor(dayEventsAll);
      const isOutside = cm !== m;
      const isToday = cy === today.getFullYear() && cm === today.getMonth() && cd === today.getDate();
      const dow = cellDate.getDay();
      const isWeekend = dow === 0 || dow === 6;

      const classes = ["cal-cell"];
      if (isOutside) classes.push("is-outside");
      if (isToday) classes.push("is-today");
      if (isWeekend) classes.push("is-weekend");

      const cap = maxVisible();
      const visible = dayEvents.length > cap ? dayEvents.slice(0, cap) : dayEvents;
      let pillsHtml = "";
      visible.forEach(ev => {
        const c = labColor(ev.lab);
        pillsHtml += `<button type="button" class="cal-pill" data-id="${escapeAttr(ev.id)}" style="background:${c.bg};color:${c.text}" title="${escapeAttr(ev.title)}">
          <span class="cal-dot" style="background:${c.text}"></span>${escapeHtml(ev.title)}
        </button>`;
      });
      if (dayEvents.length > cap){
        pillsHtml += `<button type="button" class="cal-more" data-daykey="${key}">+${dayEvents.length - visible.length} more</button>`;
      }

      html += `<div class="${classes.join(' ')}" data-daykey="${key}">
        <div class="cal-daynum">${cd}</div>
        <div class="cal-events">${pillsHtml}</div>
      </div>`;
    }

    gridEl.innerHTML = html;
    gridEl.classList.add("is-fading");
    requestAnimationFrame(() => gridEl.classList.remove("is-fading"));

    gridEl.querySelectorAll(".cal-pill").forEach(btn => {
      btn.addEventListener("click", () => openEventModal(eventsById.get(btn.dataset.id)));
    });
    gridEl.querySelectorAll(".cal-more").forEach(btn => {
      btn.addEventListener("click", () => openDayModal(btn.dataset.daykey));
    });
    gridEl.querySelectorAll(".cal-cell").forEach(cell => {
      cell.addEventListener("click", (e) => {
        if (window.innerWidth >= 560) return;
        if (e.target.closest("button")) return;
        const key = cell.dataset.daykey;
        const list = visibleEventsFor(eventMap.get(key) || []);
        if (list.length === 1) openEventModal(list[0]);
        else if (list.length > 1) openDayModal(key);
      });
    });

    notifyHeight();
  }

  /* ---------------------------------------------------------------------- */
  /* Modal — two modes: a day's list of events, or a single event's detail  */

  const modalBackdrop = document.getElementById("calModalBackdrop");
  const modalHeading = document.getElementById("calModalHeading");
  const modalBody = document.getElementById("calModalBody");
  let lastFocused = null;

  function showModal(){
    lastFocused = document.activeElement;
    modalBackdrop.classList.add("is-open");
    const focusTarget = modalBody.querySelector("button, a") || document.getElementById("calModalClose");
    focusTarget.focus();
    notifyHeight();
  }
  function closeModal(){
    modalBackdrop.classList.remove("is-open");
    if (lastFocused) lastFocused.focus();
  }
  document.getElementById("calModalClose").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  function openDayModal(key){
    const list = visibleEventsFor(eventMap.get(key) || []);
    if (!list.length) return;
    const { y, m, d } = parseISO(key);
    modalHeading.textContent = new Date(y, m, d).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

    modalBody.innerHTML = list.map(ev => {
      const c = labColor(ev.lab);
      return `<button type="button" class="cal-modal-list-item" data-id="${escapeAttr(ev.id)}">
        <span class="cal-dot" style="background:${c.text}"></span>${escapeHtml(ev.title)}
      </button>`;
    }).join("");

    modalBody.querySelectorAll(".cal-modal-list-item").forEach(btn => {
      btn.addEventListener("click", () => openEventModal(eventsById.get(btn.dataset.id), key));
    });
    showModal();
  }

  function openEventModal(ev, cameFromKey){
    if (!ev) return;
    modalHeading.textContent = "Event details";
    const tagsHtml = (ev.tags||[]).map(t => {
      const c = tagColor(t);
      return `<span class="cal-modal-tag" style="background:${c.bg};color:${c.text}">${escapeHtml(t)}</span>`;
    }).join("");

    const safeUrl = /^https?:\/\//i.test(ev.url || "");
    modalBody.innerHTML = `
      ${cameFromKey ? `<button type="button" class="cal-modal-back" id="calModalBack">&larr; Back</button>` : ""}
      <div class="cal-modal-tags">${tagsHtml}</div>
      <div class="cal-modal-bigtitle">${escapeHtml(ev.title)}</div>
      <div class="cal-modal-meta">${escapeHtml(formatEventDate(ev))}${ev.lab ? " · " + escapeHtml(ev.lab) : ""}</div>
      ${safeUrl
        ? `<a class="cal-modal-cta" href="${escapeAttr(ev.url)}" target="_top" rel="noopener">View full event details →</a>`
        : `<div class="cal-modal-cta" style="opacity:.5;cursor:default;">Link unavailable</div>`}
    `;
    if (cameFromKey){
      document.getElementById("calModalBack").addEventListener("click", () => openDayModal(cameFromKey));
    }
    showModal();
  }

  /* ---------------------------------------------------------------------- */
  /* Nav                                                                    */

  document.getElementById("calPrev").addEventListener("click", () => { viewDate.setMonth(viewDate.getMonth() - 1); render(); });
  document.getElementById("calNext").addEventListener("click", () => { viewDate.setMonth(viewDate.getMonth() + 1); render(); });
  document.getElementById("calToday").addEventListener("click", () => { viewDate = new Date(today.getFullYear(), today.getMonth(), 1); render(); });

  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

  function notifyHeight(){
    try{
      if (window.parent && window.parent !== window){
        const h = document.querySelector(".cal-app").offsetHeight;
        window.parent.postMessage({ type: "costar-calendar-resize", height: h }, "*");
      }
    }catch(e){ /* ignore */ }
  }

  /* ---------------------------------------------------------------------- */
  /* Load events.json                                                       */

  fetch("events.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(data => {
      ALL_EVENTS = (data || []).map(ev => ({ ...ev, id: ev.id || generateId() }));
      eventsById = new Map(ALL_EVENTS.map(e => [e.id, e]));
      eventMap = buildEventMap(ALL_EVENTS);
      renderFilterBar();
      render();
    })
    .catch(err => {
      gridEl.innerHTML = `<div class="cal-error">Couldn't load events.json (${escapeHtml(err.message)}).
        If you're previewing this file locally by double-clicking it, that won't work any more —
        browsers block a page from fetching a local JSON file that way. Run a tiny local server instead
        (see README.md), or view it via GitHub Pages once deployed.</div>`;
    });

})();
</script>
</body>
</html>
